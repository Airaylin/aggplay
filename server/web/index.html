<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>聚合待听</title>
<style>
:root{--bg:#101418;--card:#1a2129;--line:#2a3441;--fg:#e8edf2;--dim:#8b98a5;--acc:#4da3ff;--ok:#3ecf8e;--bad:#ff6b6b}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding-bottom:70px}
header{position:sticky;top:0;z-index:5;background:linear-gradient(#141a20,#141a20ee);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:8px}
header b{font-size:17px}
header .sp{flex:1}
button{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px;cursor:pointer}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.sm{padding:4px 8px;font-size:12px;border-radius:8px}
button:active{transform:scale(.97)}
main{padding:12px 14px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#141a20f2;border-top:1px solid var(--line);backdrop-filter:blur(6px)}
nav a{flex:1;text-align:center;padding:10px 0;color:var(--dim);text-decoration:none;font-size:12px}
nav a.on{color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.card h3{font-size:14px;margin-bottom:8px;color:var(--acc)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dim{color:var(--dim);font-size:12px}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:6px;background:#233043;color:#9fc3ff;margin-right:6px;white-space:nowrap}
.item{display:flex;align-items:center;gap:8px;padding:9px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:0}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item.cur{background:#1d2a3a;box-shadow:inset 3px 0 0 var(--acc)}
.st{font-size:11px}.st.playing{color:var(--ok)}.st.failed{color:var(--bad)}.st.pending{color:var(--dim)}
textarea,input[type=text],input[type=password]{width:100%;background:#0d1117;color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;font-family:inherit}
textarea{min-height:64px;resize:vertical;word-break:break-all}
label{display:block;margin:8px 0 3px;font-size:12px;color:var(--dim)}
.err{color:var(--bad);font-size:12px;margin-top:4px;word-break:break-all}
.okk{color:var(--ok);font-size:12px;margin-top:4px}
kbd{background:#0d1117;border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:12px}
.mut{font-size:12px;color:var(--dim);margin-top:6px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:#000c;color:#fff;padding:8px 16px;border-radius:20px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:9;max-width:86vw}
#toast.show{opacity:1}
.empty{padding:30px 10px;text-align:center;color:var(--dim)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:4px}
</style>
</head>
<body>
<header><b>🎧 聚合待听</b><span class="sp"></span>
  <select id="devsel" onchange="setState()"></select>
  <button class="sm" onclick="askPass()">口令</button>
</header>
<main id="view"></main>
<nav>
  <a data-tab="queue" class="on" onclick="tab('queue',this)">队列</a>
  <a data-tab="sources" onclick="tab('sources',this)">内容源</a>
  <a data-tab="speaker" onclick="tab('speaker',this)">音箱</a>
  <a data-tab="help" onclick="tab('help',this)">帮助</a>
</nav>
<div id="toast"></div>
<script>
const SRCNAMES={bilibili:"B站",netease:"网易云",ximalaya:"喜马拉雅",weread:"微信读书",manual:"投递"};
const PASS=localStorage.aggpass||"";
function askPass(){const p=prompt("访问口令（首次见部署日志或 data/config.json 的 admin_pass）",PASS);if(p!==null){localStorage.aggpass=p;location.reload()}}
if(!PASS)askPass();
async function api(path,opts={}){
  opts.headers=Object.assign({"X-Admin-Pass":localStorage.aggpass||"","Content-Type":"application/json"},opts.headers||{});
  const r=await fetch(path,opts);const ct=r.headers.get("content-type")||"";
  const data=ct.includes("json")?await r.json():await r.text();
  if(r.status===401){askPass();throw new Error("口令错误")}
  return data;
}
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),2200)}
function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
let TAB="queue",STATE=null;

async function refreshState(){try{STATE=await api("/api/state");if(TAB==="queue")renderQueue(true)}catch(e){}}

/* ---------- 队列 ---------- */
async function renderQueue(soft){
  if(!STATE){try{STATE=await api("/api/state")}catch(e){view.innerHTML=`<div class="card err">${esc(e.message)}</div>`;return}}
  const q=STATE.queue||[];const cur=STATE.current;
  const counts=Object.entries(STATE.counts||{}).map(([s,v])=>`<span class="badge">${SRCNAMES[s]||s} ${Object.values(v).reduce((a,b)=>a+b,0)}</span>`).join("");
  const errs=Object.entries(STATE.refresh||{}).filter(([,v])=>v.error).map(([s,v])=>`<div class="err">${SRCNAMES[s]||s}: ${esc(v.error)}</div>`).join("");
  view.innerHTML=`
  <div class="card">
    <div class="row">
      <button class="pri" onclick="playAll()">▶ 播放全部</button>
      <button onclick="ctl('pause')">⏸</button><button onclick="ctl('resume')">▶</button>
      <button onclick="ctl('next')">⏭</button><button onclick="ctl('stop')">⏹</button>
      <button class="sm" onclick="doRefresh()">刷新源</button>
    </div>
    <div style="margin-top:8px">${counts||'<span class="dim">队列为空，先到「内容源」填Cookie并刷新</span>'}${errs}
    <div class="dim" style="margin-top:4px">当前流地址: ${esc(STATE.base||"")}</div></div>
  </div>
  <div class="card">
    <h3>投递链接（B站/网易云/喜马拉雅/公众号文章/mp3直链）</h3>
    <textarea id="addtxt" placeholder="粘贴链接或分享文本…"></textarea>
    <div class="row" style="margin-top:8px"><button class="pri" onclick="addLink()">投递到队列</button></div>
    <div id="addret"></div>
  </div>
  <div class="card" style="padding:4px 0">
    ${q.length?q.map((it,i)=>`
      <div class="item ${cur&&cur.id===it.id?"cur":""}" onclick="playId(${it.id})">
        <span class="dim" style="font-size:11px;width:22px">${i+1}</span>
        <div class="t"><b><span class="badge">${SRCNAMES[it.source]||it.source}</span>${esc(it.title)}</b>
        <span class="dim">${esc(it.sub||"")}</span></div>
        <span class="st ${it.status}">${it.status==="playing"?"● 播放中":it.status==="failed"?"✕ 失败":""}</span>
      </div>`).join(""):'<div class="empty">队列为空</div>'}
  </div>
  ${q.length?`<div class="row" style="justify-content:center;margin-bottom:10px"><button class="sm" onclick="clearPlayed()">清除已听记录（可重新入队）</button></div>`:""}`;
}
async function playAll(){toast((await api("/api/play",{method:"POST",body:"{}"})).say||"")}
async function playId(id){await api("/api/play",{method:"POST",body:JSON.stringify({id})});toast("已推送播放")}
async function ctl(a){await api(`/api/control/${a}`,{method:"POST"});refreshState()}
async function addLink(){const t=document.getElementById("addtxt").value.trim();if(!t)return;
  const r=await api("/api/add",{method:"POST",body:JSON.stringify({text:t})});
  document.getElementById("addret").innerHTML=r.ok?`<div class="okk">✓ 已添加 ${r.added} 条</div>`:`<div class="err">${esc(r.error)}</div>`;
  if(r.ok)document.getElementById("addtxt").value="";refreshState()}
async function doRefresh(){toast("正在刷新各源…");const r=await api("/api/refresh",{method:"POST"});refreshState()}
async function clearPlayed(){await api("/api/clear",{method:"POST",body:JSON.stringify({what:"played"})});toast("已清除");refreshState()}

/* ---------- 内容源 ---------- */
const SOURCE_FIELDS={
  bilibili:[["cookie","Cookie（浏览器F12复制 SESSDATA=…; bili_jct=…）","textarea"]],
  netease:[["cookie","Cookie（需 MUSIC_U=…）","textarea"],["playlists","歌单ID（逗号分隔，留空=我喜欢的音乐）","text"]],
  ximalaya:[["cookie","Cookie（含 1_x_x，VIP内容必需）","textarea"],["albums","订阅专辑ID或链接（逗号分隔）","textarea"]],
  weread:[["cookie","Cookie（wr_vid=…; wr_skey=…，读书功能需要）","textarea"],["articles","文章链接（每行一个）","textarea"],["books","书ID（实验性，逗号分隔）","text"]],
  manual:[]
};
async function renderSources(){
  view.innerHTML=`<div class="dim" style="margin:0 2px 10px">逐个启用 → 填Cookie → 保存 → 点测试。</div>`+
  Object.entries(SOURCE_FIELDS).map(([s,fields])=>`
  <div class="card"><h3>${SRCNAMES[s]}</h3>
   <label><input type="checkbox" id="en_${s}"> 启用</label>
   ${fields.map(([k,ph])=>`${k==="cookie"?`<label>${ph}</label><textarea id="f_${s}_${k}" placeholder="${ph}"></textarea>`
     :`<label>${ph.replace(/（.*/,"")}</label><textarea id="f_${s}_${k}" style="min-height:44px" placeholder="${ph}"></textarea>`}`).join("")}
   <div class="row" style="margin-top:8px">
     <button class="pri" onclick="saveSource('${s}')">保存</button>
     <button onclick="testSource('${s}')">测试</button><span id="t_${s}"></span>
   </div><div class="err" id="e_${s}"></div>
  </div>`).join("");
  // 填充现有配置
  const full=await (await fetch("/api/sources_cfg",{headers:{"X-Admin-Pass":localStorage.aggpass}})).json();
  window.SRC_CFG=full;
  for(const[s]of Object.entries(SOURCE_FIELDS)){const c=full[s]||{};
    const en=document.getElementById("en_"+s);if(en)en.checked=!!c.enabled;
    for(const[k]of SOURCE_FIELDS[s]){const e=document.getElementById(`f_${s}_${k}`);if(!e)continue;
      const v=c[k];e.value=Array.isArray(v)?v.join(",\n"):(v||"")}}
}
async function saveSource(s){
  const body={sources:{}};body.sources[s]={enabled:document.getElementById("en_"+s).checked};
  for(const[k]of SOURCE_FIELDS[s]){let v=document.getElementById(`f_${s}_${k}`).value.trim();
    if(["playlists","albums","books"].includes(k))v=v.split(/[,，\n]/).map(x=>x.trim()).filter(Boolean);
    body.sources[s][k]=v}
  const r=await api("/api/config",{method:"POST",body:JSON.stringify(body)});
  document.getElementById("e_"+s).textContent=r.ok?"":"保存失败";toast("已保存")}
async function testSource(s){
  document.getElementById("t_"+s).textContent="测试中…";
  const r=await api(`/api/smoke?source=${s}`);
  const x=r[s]||{};document.getElementById("t_"+s).textContent="";
  document.getElementById("e_"+s).innerHTML=x.ok
    ?`<span class="okk">✓ 拉到 ${x.count} 条，首条「${esc(x.first)}」${x.first_has_url?"，直链OK":""}</span>`
    :`<span class="err">✕ ${esc(x.error)}</span>`}

/* ---------- 音箱 ---------- */
async function renderSpeaker(){
  const c=window.SPK_CFG||{};
  view.innerHTML=`
  <div class="card"><h3>小米账号（登录失败时可改用抓包Cookie）</h3>
    <label>账号</label><input type="text" id="xu" value="${esc(c.user||"")}" autocomplete="off">
    <label>密码</label><input type="password" id="xp" value="">
    <label>手动Cookie兜底（userId=…; serviceToken=…，触发验证码时用）</label><textarea id="xc" style="min-height:44px">${esc(c.cookie||"")}</textarea>
    <div class="row" style="margin-top:8px"><button class="pri" onclick="saveSpeaker()">保存</button>
    <button onclick="testDevices()">测试登录/设备</button><span id="devinfo"></span></div>
    <div class="err" id="deverr"></div>
  </div>
  <div class="card"><h3>播放设置</h3>
    <label>对外拉流地址 public_base（一般自动探测；音箱播不了时手动填 http://IP:端口）</label>
    <input type="text" id="pb" value="${esc(window.PB||"")}">
    <label><input type="checkbox" id="ann" ${c.announce===false?"":"checked"}> 播放前报幕（第N条+标题）</label>
    <label><input type="checkbox" id="brm" ${c.bili_remove?"checked":""}> B站播完自动移出稍后再看</label>
    <label>报幕/合成音色</label>
    <select id="voice" style="width:100%;background:#0d1117;color:#fff;border:1px solid var(--line);border-radius:10px;padding:8px">
      ${["zh-CN-XiaoxiaoNeural","zh-CN-YunxiNeural","zh-CN-YunyangNeural","zh-CN-XiaoyiNeural"].map(v=>`<option ${v===(c.tts_voice||"zh-CN-XiaoxiaoNeural")?"selected":""}>${v}</option>`).join("")}
    </select>
    <div class="row" style="margin-top:8px"><button class="pri" onclick="saveSpeaker()">保存</button>
    <button onclick="testTTS()">TTS测试</button><span id="ttsret"></span></div>
  </div>
  <div class="card"><h3>修改访问口令</h3>
    <input type="text" id="np" placeholder="新口令">
    <div class="row" style="margin-top:8px"><button onclick="savePass()">改口令</button></div>
  </div>`;
}
async function saveSpeaker(){
  const body={xiaomi:{user:v("xu"),pass:v("xp")||undefined,cookie:v("xc")},
    public_base:v("pb"),announce:document.getElementById("ann").checked,
    bili_remove_after_play:document.getElementById("brm").checked,
    tts_voice:document.getElementById("voice").value};
  if(!body.xiaomi.pass)delete body.xiaomi.pass; // 留空=不改
  const r=await api("/api/config",{method:"POST",body:JSON.stringify(body)});
  toast(r.ok?"已保存":"失败");loadSpk()}
function v(id){return document.getElementById(id).value.trim()}
async function loadSpk(){const r=await api("/api/spk_cfg");window.SPK_CFG=r.xiaomi||{};window.PB=r.public_base}
async function testDevices(){document.getElementById("devinfo").textContent="测试中…";
  const r=await api("/api/speaker/devices",{method:"GET"});
  document.getElementById("devinfo").textContent="";
  document.getElementById("deverr").innerHTML=r.ok
    ?`<span class="okk">✓ ${esc(r.device.hardware)} (${esc(r.device.device_id.slice(0,8))}…) 状态:${esc((r.status||{}).status||"?")}</span>`
    :`<span class="err">✕ ${esc(r.error)}</span>`}
async function testTTS(){document.getElementById("ttsret").textContent="播放中…";
  const r=await api("/api/speaker/test_tts",{method:"POST",body:JSON.stringify({text:"聚合待听已就绪"})});
  document.getElementById("ttsret").textContent=r.ok?"✓":"✕"+(r.error||"")}
async function savePass(){const r=await api("/api/config",{method:"POST",body:JSON.stringify({new_admin_pass:v("np")})});
  if(r.ok){localStorage.aggpass=r.admin_pass;toast("口令已改并更新本机")} }

/* ---------- 帮助 ---------- */
function renderHelp(){view.innerHTML=`
  <div class="card"><h3>语音口令（对小爱音箱说）</h3>
   <div class="mut">
    <p><kbd>播放我的待听</kbd> / <kbd>播放稍后再看</kbd> — 整个队列连播</p>
    <p><kbd>播放B站</kbd> <kbd>播放网易云</kbd> <kbd>播放喜马拉雅</kbd> <kbd>播放微信读书</kbd></p>
    <p><kbd>有什么内容</kbd> — 播报队列摘要</p>
    <p><kbd>下一个</kbd> <kbd>上一个</kbd> <kbd>暂停</kbd> <kbd>继续</kbd> <kbd>停止</kbd></p>
    <p><kbd>播放第三个</kbd> <kbd>播放流浪地球</kbd>（标题模糊匹配）</p>
    <p><kbd>音量大一点</kbd> <kbd>音量调到40</kbd></p>
    <p class="dim">不在口令表里的话不会拦截，小爱原生功能照常。</p>
   </div></div>
  <div class="card"><h3>各平台Cookie怎么拿</h3>
   <div class="mut">
    <p><b>B站</b>：电脑浏览器登录 bilibili.com → F12 → 应用/Application → Cookie → 复制 <kbd>SESSDATA</kbd> 和 <kbd>bili_jct</kbd> 的值，拼成 <code>SESSDATA=xxx; bili_jct=yyy</code></p>
    <p><b>网易云</b>：登录 music.163.com → 同上，复制 <kbd>MUSIC_U</kbd></p>
    <p><b>喜马拉雅</b>：登录 ximalaya.com → 复制整个 Cookie（特别是 <kbd>1_x_x</kbd>）</p>
    <p><b>微信读书</b>：登录 weread.qq.com → 复制 <kbd>wr_vid</kbd> <kbd>wr_skey</kbd></p>
    <p class="dim">Cookie 只存在你自己服务器的 data/config.json 里。</p>
   </div></div>
  <div class="card"><h3>安卓App</h3>
   <div class="mut">装「聚合待听」App后：任意App里点 分享 → 聚合待听 即投递；或下拉通知栏点「投递剪贴板」；App首页大按钮=让音箱开播。</div></div>`}

/* ---------- 路由 ---------- */
const view=document.getElementById("view");
function tab(t,el){TAB=t;document.querySelectorAll("nav a").forEach(a=>a.classList.remove("on"));el.classList.add("on");
  if(t==="queue")renderQueue();else if(t==="sources")renderSources();else if(t==="speaker"){loadSpk().then(renderSpeaker)}else renderHelp()}
setInterval(()=>{if(TAB==="queue")refreshState()},3000);
renderQueue();
</script>
</body>
</html>
